<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="rest countries api with color theme switcher master"
    />
    <title>rest countries</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="theme-light">
    <header class="header">
      <div
        class="container py-4 d-flex justify-content-between align-items-center"
      >
        <h3>Where in the world</h3>
        <button
          type="button"
          class="mode-dark-sun d-flex align-items-center gap-3"
        >
          <i class="fa-regular fa-moon"></i>
          <div class="text-mode">Dark Mode</div>
        </button>
      </div>
    </header>

    <!-- ====== page ---- info ---- country ===== -->
    <div class="page-info-country py-5 hide-all">
      <div class="container">
        <div
          class="icon-back mb-3 d-flex justify-content-center align-items-center gap-3"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <div>Back</div>
        </div>

        <div class="inside-info d-flex align-items-center"></div>
      </div>
    </div>

    <!-- ============== section ================== -->

    <main>
      <section class="choices show-all">
        <div class="py-5 head-sec">
          <div
            class="container d-flex align-items-start justify-content-between"
          >
            <div class="search-country d-flex align-items-center gap-3">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                class="srch-name"
                type="text"
                placeholder="Search for a country..."
              />
            </div>
            <div class="filter-by-region">
              <div
                class="head-filter d-flex align-items-center justify-content-between mb-2"
              >
                <div class="text-filter">Filter by Region</div>
                <i class="fa-solid fa-angle-down"></i>
              </div>

              <ul
                class="bottom-filter position-absolute hide list-unstyled m-0 py-3 px-4"
              >
                <li data-contnent=".all" class="mb-1">All</li>
                <li data-contnent=".Africa" class="mb-1">Africa</li>
                <li data-contnent=".America" class="mb-1">America</li>
                <li data-contnent=".Asia" class="mb-1">Asia</li>
                <li data-contnent=".Euro" class="mb-1">Europe</li>
                <li data-contnent=".Ocean">Oceania</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- ===== another -page  -->

        <div class="container">
          <div class="page all">
            <div class="row"></div>
          </div>

          <div class="page Africa">
            <div class="row row-africa"></div>
          </div>

          <div class="page America">
            <div class="row row-america"></div>
          </div>

          <div class="page Asia">
            <div class="row row-asia"></div>
          </div>

          <div class="page Euro">
            <div class="row row-euro"></div>
          </div>

          <div class="page Ocean">
            <div class="row row-ocean"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
